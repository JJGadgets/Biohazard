---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 1-core-hardware-amd-gpu-operator-app
  namespace: flux-system
spec:
  path: ./kube/deploy/core/hardware/amd-gpu-operator/app
  targetNamespace: amd-gpu-operator
  dependsOn:
    - name: 1-core-hardware-node-feature-discovery-app
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: amd-gpu-operator
      namespace: amd-gpu-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 1-core-hardware-amd-gpu-operator-tuning
  namespace: flux-system
spec:
  path: ./kube/deploy/core/hardware/amd-gpu-operator/tuning
  targetNamespace: amd-gpu-operator
  dependsOn:
    - name: 1-core-hardware-amd-gpu-operator-app
      namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: r9700-tuning
      namespace: amd-gpu-operator
