---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu-operator
  namespace: amd-gpu-operator
  labels:
    egress.home.arpa/apiserver: allow
spec:
  interval: 1h
  chart:
    spec:
      chart: gpu-operator-charts
      version: v1.5.1
      sourceRef:
        kind: HelmRepository
        name: rocm-gpu-operator
        namespace: flux-system
  values:
    node-feature-discovery:
      enabled: false
    installdefaultNFDRule: true
    kmm:
      enabled: false
      watch: false
    remediation:
      enabled: false
      installCRDs: false
    controllerManager:
      manager:
    deviceConfig:
      spec:
        selector:
          feature.node.kubernetes.io/amd-gpu: "true"
          kubernetes.io/hostname: sinon
        driver:
          enable: false
          blacklist: false
        devicePlugin:
          enableDevicePlugin: false
          enableNodeLabeller: false
        draDriver:
          enable: true
          tolerations:
            - key: llm.internal
              operator: Exists
              effect: NoSchedule
        metricsExporter:
          enable: true
          serviceType: ClusterIP
          tolerations:
            - key: llm.internal
              operator: Exists
              effect: NoSchedule
        testRunner:
          enable: false
        configManager:
          enable: false
    draDriver:
      deviceClass:
        create: true
  postRenderStrategy: combined
  postRenderers:
    - kustomize:
        patches:
          # AMD GPU Operator controller-manager pods
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: ".*-gpu-operator-charts-controller-manager$"
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ignored
              spec:
                template:
                  metadata:
                    labels:
                      egress.home.arpa/apiserver: "allow"

          # All Job pods rendered by this Helm chart
          - target:
              group: batch
              version: v1
              kind: Job
            patch: |-
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ignored
              spec:
                template:
                  metadata:
                    labels:
                      egress.home.arpa/apiserver: "allow"

