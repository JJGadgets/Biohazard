---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu-operator
  namespace: amd-gpu-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: gpu-operator-charts
      version: v1.5.1
      sourceRef:
        kind: HelmRepository
        name: rocm-gpu-operator
        namespace: flux-system
  values:
    node-feature-discovery:
      enabled: false
    installdefaultNFDRule: true
    kmm:
      enabled: false
      watch: false
    remediation:
      enabled: false
      installCRDs: false
    controllerManager:
      manager:
    deviceConfig:
      spec:
        selector:
          feature.node.kubernetes.io/amd-gpu: "true"
          kubernetes.io/hostname: sinon
        driver:
          enable: false
          blacklist: false
        devicePlugin:
          enableDevicePlugin: false
          enableNodeLabeller: false
        draDriver:
          enable: true
          tolerations:
            - key: llm.internal
              operator: Exists
              effect: NoSchedule
        metricsExporter:
          enable: true
          serviceType: ClusterIP
          tolerations:
            - key: llm.internal
              operator: Exists
              effect: NoSchedule
        testRunner:
          enable: false
        configManager:
          enable: false
    draDriver:
      deviceClass:
        create: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: ".*-gpu-operator-charts-controller-manager$"
            patch: |-
              - op: add
                path: /spec/template/metadata/labels/egress.home.arpa~apiserver
                value: "true"
