---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu-operator
  namespace: amd-gpu-operator
  labels:
    egress.home.arpa/apiserver: allow
spec:
  interval: 1h
  chart:
    spec:
      chart: gpu-operator-charts
      version: v1.5.1
      sourceRef:
        kind: HelmRepository
        name: rocm-gpu-operator
        namespace: flux-system
  values:
    crds:
      defaultCR:
        install: true
        upgrade: true
    node-feature-discovery:
      enabled: false
    installdefaultNFDRule: true
    kmm:
      enabled: false
      watch: false
    remediation:
      enabled: false
      installCRDs: false
    controllerManager:
      manager:
    deviceConfig:
      spec:
        selector:
          feature.node.kubernetes.io/amd-gpu: "true"
          kubernetes.io/hostname: sinon
        driver:
          enable: false
          blacklist: false
        devicePlugin:
          enableDevicePlugin: false
          enableNodeLabeller: false
          tolerations:
            - key: llm.internal
              operator: Exists
              effect: NoSchedule
        draDriver:
          enable: true
          image: docker.io/rocm/k8s-gpu-dra-driver:v1.0.1@sha256:f173c8e78bc819e2b8adc15192afefaf69a11307d49fca5382bda82885975830
          tolerations:
            - key: llm.internal
              operator: Exists
              effect: NoSchedule
        metricsExporter:
          enable: true
          serviceType: ClusterIP
          tolerations:
            - key: llm.internal
              operator: Exists
              effect: NoSchedule
        testRunner:
          enable: false
        configManager:
          enable: false
    draDriver:
      deviceClass:
        create: true
