---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app miniflux
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      app:
        type: deployment
        replicas: 1
        pod:
          labels:
            ingress.home.arpa/envoy-internal: allow
            db.home.arpa/pg: pg-default
            authentik.home.arpa/oidc: allow
            egress.home.arpa/internet: allow
            # egress.home.arpa/discord: allow
            egress.home.arpa/ntfy: allow
        containers:
          app:
            image: &img
              repository: ghcr.io/miniflux/miniflux
              tag: "2.3.3-distroless@sha256:59e4e31b349f008ecd34b547f23498b1d8abc0c03d5f6d12bdb713ab7f7c04bf"
            env:
              TZ: "${CONFIG_TZ}"
              BASE_URL: "https://${APP_DNS_MINIFLUX}"
              RUN_MIGRATIONS: "1"
              CREATE_ADMIN: "1"
              OAUTH2_PROVIDER: oidc
              OAUTH2_REDIRECT_URL: https://${APP_DNS_MINIFLUX}/oauth2/oidc/callback
              OAUTH2_OIDC_DISCOVERY_ENDPOINT: https://${APP_DNS_AUTH}/application/o/miniflux/
              OAUTH2_USER_CREATION: "1"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "pg-default-pguser-miniflux"
                    key: "pgbouncer-uri"
            envFrom: &envFrom
              - secretRef:
                  name: miniflux-secrets
            securityContext: &sc
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "10m"
                memory: "128Mi"
              limits:
                cpu: "1"
                memory: "512Mi"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      app:
        controller: app
        ports:
          http:
            port: 80
            targetPort: 8080
            protocol: HTTP
            appProtocol: http
    route:
      app:
        hostnames: ["${APP_DNS_MINIFLUX:=miniflux}"]
        parentRefs:
          - name: envoy-internal
            namespace: ingress
            sectionName: internal
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostAliases:
        - ip: "${APP_IP_AUTHENTIK:=127.0.0.1}"
          hostnames: ["${APP_DNS_AUTHENTIK:=authentik}"]
        - ip: "${APP_IP_NTFY_MX:=127.0.0.1}"
          hostnames: ["${APP_DNS_NTFY:=ntfy}"]
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid ${APP_UID_MINIFLUX:=1000}
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: Always
        seccompProfile: { type: "RuntimeDefault" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "fuckoff.home.arpa/{{ .Release.Name }}"
                    operator: DoesNotExist
