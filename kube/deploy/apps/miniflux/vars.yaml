---
# yaml-language-server: $schema=https://crds.jank.ing/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${CLUSTER_NAME:=biohazard}-vars"
  namespace: miniflux
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1p
  dataFrom:
    - extract:
        key: ".${CLUSTER_NAME}-vars"
    - extract: # delete if authentik OIDC not used
        key: "authentik vars - ${CLUSTER_NAME}"
    - extract:
        key: "miniflux - ${CLUSTER_NAME}"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: *name
    template:
      type: Opaque
      data:
        # Core cluster-wide vars
        CLUSTER_NAME: "${CLUSTER_NAME:=biohazard}"
        CONFIG_TZ: '{{ .CONFIG_TZ }}'
        # App specific
        APP_DNS_MINIFLUX: '{{ .APP_DNS_MINIFLUX }}'
        APP_UID_MINIFLUX: '{{ .APP_UID_MINIFLUX }}'
        # authentik hostAliases (delete if authentik OIDC not used)
        APP_DNS_AUTHENTIK: '{{ .APP_DNS_AUTHENTIK }}'
        APP_IP_AUTHENTIK: '{{ .APP_IP_AUTHENTIK }}'
        # ntfy hostAliases
        APP_DNS_NTFY: '{{ .APP_DNS_NTFY }}'
        APP_IP_NTFY_MX: '{{ .APP_IP_NTFY_MX }}'
        # Other cluster-wide vars (delete where unnecessary)
        IP_JJ_V4: '{{ .IP_JJ_V4 }}'
        IP_POD_CIDR_INGRESS_V4: '{{ .IP_POD_CIDR_INGRESS_V4 }}'
        DNS_CF: '{{ .DNS_CF }}'
        IP_TRUENAS: '{{ .IP_TRUENAS }}'
        PATH_NAS_PERSIST_K8S: '{{ .PATH_NAS_PERSIST_K8S }}'
