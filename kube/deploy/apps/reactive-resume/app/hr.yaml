---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app reactive-resume
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        pod:
          labels:
            ingress.home.arpa/nginx-internal: "allow"
            tailscale.com/expose: "true"
            db.home.arpa/pg: "pg-home"
            s3.home.arpa/store: "rgw-${CLUSTER_NAME}"
            ingress.home.arpa/jjgadgets: "allow"
        containers:
          main:
            image: &serverImg
              repository: ghcr.io/jjgadgets/reactive-resume
              tag: server-3.7.5
            env: &env
              TZ: "${CONFIG_TZ}"
              PUBLIC_URL: "http://${APP_IP_REACTIVE_RESUME}:3000"
              PUBLIC_SERVER_URL: "http://${APP_IP_REACTIVE_RESUME}:3100"
              STORAGE_URL_PREFIX: "https://${APP_DNS_RGW_S3}/reactive-resume-media"
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: "pg-home-pguser-reactive-resume"
                    key: "host"
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: "pg-home-pguser-reactive-resume"
                    key: "dbname"
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: "pg-home-pguser-reactive-resume"
                    key: "user"
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "pg-home-pguser-reactive-resume"
                    key: "password"
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: "reactive-resume-secrets"
                    key: "SECRET_KEY"
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: "reactive-resume-secrets"
                    key: "JWT_SECRET"
              JWT_EXPIRY_TIME: "604800"
              STORAGE_ENDPOINT: "http://rook-ceph-rgw-${CLUSTER_NAME}.rook-ceph.svc:6953/reactive-resume-media"
              STORAGE_BUCKET: "reactive-resume-media"
              STORAGE_REGION: "us-east-1"
              STORAGE_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: "reactive-resume-media-s3"
                    key: "AWS_ACCESS_KEY_ID"
              STORAGE_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: "reactive-resume-media-s3"
                    key: "AWS_SECRET_ACCESS_KEY"
            resources:
              requests:
                cpu: "10m"
              limits:
                cpu: "3000m"
                memory: "600Mi"
          frontend:
            image: &clientImg
              repository: ghcr.io/jjgadgets/reactive-resume
              tag: client-3.7.5
            env: *env
            resources:
              requests:
                cpu: "10m"
              limits:
                cpu: "3000m"
                memory: "600Mi"
    service:
      main:
        primary: true
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          "io.cilium/lb-ipam-ips": "${APP_IP_REACTIVE_RESUME}"
        ports:
          http:
            port: 3100
          frontend:
            port: 3000
    ingress:
      main:
        ingressClassName: "nginx-internal"
        annotations:
          nginx.ingress.kubernetes.io/use-regex: "true"
          nginx.ingress.kubernetes.io/rewrite-target: "/$2"
          nginx.ingress.kubernetes.io/whitelist-source-range: |
            ${IP_JJ_V4}
        hostnames: ["${APP_DNS_REACTIVE_RESUME}"]
        paths:
          - path: "/api(/|$)(.*)"
            pathType: ImplementationSpecific
            service:
              identifier: main
              port: http
      backend:
        ingressClassName: "nginx-internal"
        annotations:
          nginx.ingress.kubernetes.io/whitelist-source-range: |
            ${IP_JJ_V4}
        hostnames: ["${APP_DNS_REACTIVE_RESUME}"]
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: frontend
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: false
        runAsUser: &uid 0
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: "Always"
        seccompProfile: { type: "RuntimeDefault" }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "fuckoff.home.arpa/reactive-resume"
                    operator: "DoesNotExist"
