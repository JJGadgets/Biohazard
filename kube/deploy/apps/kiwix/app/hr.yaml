---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kiwix
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      app:
        type: deployment
        replicas: 2
        strategy: RollingUpdate
        pod:
          labels:
            ingress.home.arpa/envoy-internal: allow
        containers:
          app:
            image: &img
              repository: ghcr.io/kiwix/kiwix-tools
              tag: 3.8.2@sha256:40ab5f450231836321d6a1e417006033db5883f883d08e85b246d2ecf8840a75
            command: ["/usr/bin/dumb-init", "--", "/bin/sh", "-c", "/usr/local/bin/kiwix-serve --address=$(IP) --port=$(PORT) --nodatealiases $(find /data -type f -iname '*.zim')"]
            env: &env
              TZ: "${CONFIG_TZ}"
              PORT: &http 8080
              IP:
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: status.podIP
            securityContext: &sc
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "10m"
              limits:
                cpu: "4"
                memory: "100Mi"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
      dl-ifixit: &dl
        type: job
        pod:
          annotations:
            reloader.stakater.com/auto: "false"
          labels:
            egress.home.arpa/internet: allow
        containers:
          app: &dl-ct
            image:
              repository: nixery.dev/wget
              tag: latest@sha256:53cc0c35ce001da444dc4543b99ebc72813410bc9182d3ec1ee81e41a1228b5b
              pullPolicy: Always
            command: ["wget", "--output-document=/data/$(ZIM).zim", "https://download.kiwix.org/zim/$(CAT)/$(ZIM).zim"]
            env:
              CAT: ifixit
              ZIM: ifixit_en_all_2025-06
            securityContext: *sc
            resources:
              requests:
                cpu: "10m"
              limits:
                cpu: "1"
                memory: "512Mi"
      dl-archlinux:
        <<: *dl
        containers:
          app:
            <<: *dl-ct
            env:
              CAT: other
              ZIM: archlinux_en_all_maxi_2025-09
      dl-alpinelinux:
        <<: *dl
        containers:
          app:
            <<: *dl-ct
            env:
              CAT: other
              ZIM: alpinelinux_en_all_maxi_2025-09
      dl-wikipedia-mini:
        <<: *dl
        containers:
          app:
            <<: *dl-ct
            env:
              CAT: wikipedia
              ZIM: wikipedia_en_all_mini_2025-06
      dl-wikipedia-computers:
        <<: *dl
        containers:
          app:
            <<: *dl-ct
            env:
              CAT: wikipedia
              ZIM: wikipedia_en_computer_nopic_2025-09
    service:
      app:
        controller: app
        ports:
          http:
            port: 80
            targetPort: *http
            protocol: HTTP
            appProtocol: http
    route:
      app:
        hostnames: ["${APP_DNS_KIWIX:=kiwix}"]
        parentRefs:
          - name: envoy-internal
            namespace: ingress
            sectionName: internal
    persistence:
      data:
        existingClaim: kiwix-library
        advancedMounts:
          app:
            app:
              - subPath: data
                path: /data
      tmpl:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - subPath: tmp
            path: /tmp
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostAliases:
        - ip: "${APP_IP_AUTHENTIK:=127.0.0.1}"
          hostnames: ["${APP_DNS_AUTHENTIK:=authentik}"]
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid 65534
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: Always
        seccompProfile: { type: "RuntimeDefault" }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: "{{ .Release.Name }}"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "fuckoff.home.arpa/{{ .Release.Name }}"
                    operator: DoesNotExist
    networkpolicies:
      same-ns:
        podSelector: {}
        policyTypes: [Ingress, Egress]
        rules:
          ingress:
            - from:
                - podSelector: {}
          egress:
            - to:
                - podSelector: {}
