---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app deeptutor
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      app:
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
          labels:
            ingress.home.arpa/envoy-internal: allow
            ai.internal/llmkube: allow
        initContainers:
          bootstrap:
            image: &image
              repository: ghcr.io/hkuds/deeptutor
              tag: 1.7.2@sha256:9b8b21ea8861434868ba20adf70966ad9dce193c507c2dcceffbe57264306da8
            command:
              - /bin/sh
              - -euc
              - |
                mkdir -p /app/data/user/settings
                for name in model_catalog.json llamaindex.json system.json; do
                  dest="/app/data/user/settings/$name"
                  if [ ! -s "$dest" ]; then
                    install -m 0600 "/bootstrap/$name" "$dest"
                  fi
                done
            securityContext: &secure
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image: *image
            env:
              TZ: "${CONFIG_TZ}"
              DEEPTUTOR_WORKSPACE_ROOT: /app/data/user/workspace
              DEEPTUTOR_WORKSPACE_ALLOWED_ROOTS: /app/data/user/workspace
              DEEPTUTOR_RERANK_URL: http://llmkube.llmkube.svc.cluster.local/v1/rerank
              PYTHONDONTWRITEBYTECODE: "1"
            securityContext: *secure
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "4"
                memory: 4Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: 8001
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: 8001
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3782
                  periodSeconds: 10
                  timeoutSeconds: 5
    service:
      app:
        controller: app
        ports:
          http:
            port: 80
            targetPort: 3782
            protocol: HTTP
            appProtocol: http
    route:
      app:
        hostnames: ["${APP_DNS_DEEPTUTOR:=deeptutor}"]
        parentRefs:
          - name: envoy-internal
            namespace: ingress
            sectionName: internal
    persistence:
      data:
        existingClaim: deeptutor-data
        globalMounts:
          - path: /app/data
      bootstrap:
        type: configMap
        name: deeptutor-bootstrap
        advancedMounts:
          app:
            bootstrap:
              - path: /bootstrap
                readOnly: true
            app:
              - path: /app/deeptutor/services/rag/pipelines/llamaindex/rerank.py
                subPath: rerank.py
                readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        globalMounts:
          - path: /tmp
      home:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        globalMounts:
          - path: /home/deeptutor
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 32Mi
        globalMounts:
          - path: /run
      logs:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        globalMounts:
          - path: /var/log
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: gvisor
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid 1000
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "fuckoff.home.arpa/{{ .Release.Name }}"
                    operator: DoesNotExist
