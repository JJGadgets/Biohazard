---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-app
  namespace: &ns toolhive
  labels: &l
    app.kubernetes.io/name: "toolhive"
spec:
  targetNamespace: *ns
  commonMetadata:
    labels: *l
  path: ./kube/deploy/apps/toolhive/app
  components:
    - ../../../core/flux-system/alerts/template/
  dependsOn:
    - name: crds
      namespace: flux-system
    # - name: toolhive-db
    # - name: toolhive-pvc
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-mcp
  namespace: &ns toolhive
  labels: &l
    app.kubernetes.io/name: "toolhive"
spec:
  targetNamespace: *ns
  commonMetadata:
    labels: *l
  path: ./kube/deploy/apps/toolhive/mcp
  dependsOn:
    - name: crds
      namespace: flux-system
    # - name: toolhive-db
    # - name: toolhive-pvc
