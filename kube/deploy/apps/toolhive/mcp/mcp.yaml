---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpgroup_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPGroup
metadata:
  name: mcp
  namespace: mcp
spec:
  description: Optimized MCP tools for AI assistants
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcptelemetryconfig_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPTelemetryConfig
metadata:
  name: mcp
  namespace: mcp
spec:
  prometheus:
    enabled: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp
  namespace: mcp
spec:
  groupRef:
    name: mcp
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      embeddingModel: qwen3-embedding-0.6b
      embeddingProvider: openai
      embeddingService: http://llmkube.llmkube.svc.cluster.local/v1
      embeddingServiceTimeout: 180s
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    metadata:
      labels:
        ingress.home.arpa/envoy-internal: allow
        ai.internal/llmkube: allow
        egress.home.arpa/apiserver: allow
    spec:
      containers:
        - name: vmcp
          # env:
          #   - name: OPENAI_API_KEY
          #     valueFrom:
          #       secretKeyRef:
          #         name: toolhive-embed
          #         key: OPENAI_API_KEY
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
  # sessionStorage:
  #   address: toolhive-config-dragonfly.llm:6379
  #   db: 0
  #   keyPrefix: "toolhive:vmcp:"
  #   passwordRef:
  #     key: password
  #     name: toolhive-config-redis
  #   provider: redis
  telemetryConfigRef:
    name: mcp
    serviceName: vmcp-mcp

#http://vmcp-mcp.mcp.svc.cluster.local:4483/mcp
