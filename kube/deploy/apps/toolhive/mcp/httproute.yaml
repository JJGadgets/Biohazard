---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: mcp
spec:
  hostnames: ["${APP_DNS_TOOLHIVE:=toolhive}"]
  parentRefs:
    - name: envoy-internal
      namespace: ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: vmcp-mcp
          port: 4483
