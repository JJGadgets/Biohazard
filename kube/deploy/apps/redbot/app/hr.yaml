---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app redbot
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      app:
        type: deployment
        replicas: 1
        pod:
          labels:
            egress.home.arpa/discord: "allow"
            egress.home.arpa/github: "allow"
            egress.home.arpa/pypi: "allow"
        containers:
          app:
            image: &img
              repository: "jank.ing/jjgadgets/redbot"
              tag: "3.5.22@sha256:0b4cdbc40cfb2e19d8555348ac0457f260e01e98f20804c6d222481b7808e1f0"
            args: ["--mentionable"]
            env: &env
              TZ: "${CONFIG_TZ}"
              NAME: "JJGadgets"
              PREFIXES: "yui. y."
              TOKEN_FILE: &token "/secrets/token"
              OWNER_FILE: &owner "/secrets/owner"
              BASE_PATH: "/config"
              STORAGE_TYPE: "JSON"
            envFrom: &envFrom
              - secretRef:
                  name: redbot-secrets
            securityContext: &sc
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "10m"
                memory: "128Mi"
              limits:
                cpu: "3000m"
                memory: "6000Mi"
    persistence:
      config:
        existingClaim: "redbot-data"
        advancedMounts:
          app:
            app:
              - subPath: "config"
                path: "/config"
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - subPath: "tmp"
            path: "/tmp"
          - subPath: "cache"
            path: "/.cache"
      secrets:
        type: secret
        name: "redbot-secrets"
        defaultMode: 0400
        advancedMounts:
          app:
            app:
              - subPath: "TOKEN"
                path: *token
                readOnly: true
              - subPath: "OWNER"
                path: *owner
                readOnly: true
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid ${APP_UID_REDBOT}
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: "Always"
        seccompProfile: { type: "RuntimeDefault" }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: "{{ .Release.Name }}"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "fuckoff.home.arpa/{{ .Release.Name }}"
                    operator: "DoesNotExist"
    networkpolicies:
      main:
        enabled: false