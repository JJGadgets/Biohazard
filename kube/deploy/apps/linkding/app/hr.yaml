---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app linkding
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      app:
        type: deployment
        replicas: 1
        pod: &p
          labels:
            ingress.home.arpa/nginx-internal: allow
            authentik.home.arpa/https: allow
            egress.home.arpa/internet: allow
        containers:
          app:
            image: &img
              repository: ghcr.io/sissbruecker/linkding
              tag: 1.45.0-plus@sha256:d36c779808dd0980fc60a15167ca119b8be7f90debdd068fb038f227a87c106d
            env: &env
              TZ: "${CONFIG_TZ}"
              # Security
              LD_ENABLE_OIDC: "True"
              LD_CSRF_TRUSTED_ORIGINS: "https://${APP_DNS_LINKDING}"
              # Options
              LD_SERVER_PORT: &http 8080
              LD_LOG_X_FORWARDED_FOR: "true"
              LD_FAVICON_PROVIDER: "https://icons.duckduckgo.com/ip3/{domain}.ico"
              LD_ENABLE_SNAPSHOTS: "True"
              LD_ASSET_FOLDER: &snap "/assets/" # local archive path (do NOT use LD_SINGLEFILE_PATH that's the executable location)
              LD_FAVICON_FOLDER: &fav "/favicons"
              LD_PREVIEW_FOLDER: &preview "/preview"
              # Database
              LD_DB_ENGINE: sqlite
            envFrom:
              - secretRef:
                  name: linkding-secrets
            securityContext: &sc
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "10m"
              limits:
                cpu: "1"
                memory: 200Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
      bg-tasks:
        type: deployment
        replicas: 1
        pod: *p
        containers:
          bg-tasks: # taken from supervisord config
            image: *img
            command: ["python", "manage.py", "run_huey", "-f"]
            env:
              <<: *env
              HOME: /tmp/home
            securityContext: *sc
            resources:
              requests:
                cpu: 10m
              limits:
                cpu: "1"
                memory: 2Gi
    service:
      app:
        controller: app
        ports:
          http:
            port: 80
            targetPort: *http
            protocol: HTTP
            appProtocol: http
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: "${DNS_CF:=cf}"
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames: ["${APP_DNS_LINKDING:=linkding}"]
        parentRefs:
          - name: envoy-internal
            namespace: ingress
            sectionName: internal
    persistence:
      data:
        existingClaim: linkding-data
        advancedMounts:
          app:
            app:
              - subPath: data
                path: /etc/linkding/data
          bg-tasks:
            bg-tasks:
              - subPath: data
                path: /etc/linkding/data
      snapshots:
        existingClaim: linkding-snapshots
        advancedMounts:
          app:
            app:
              - subPath: assets
                path: *snap
          bg-tasks:
            bg-tasks:
              - subPath: assets
                path: *snap
      misc:
        existingClaim: linkding-misc
        advancedMounts:
          app:
            app:
              - subPath: favicons
                path: *fav
              - subPath: preview
                path: *preview
          bg-tasks:
            bg-tasks:
              - subPath: favicons
                path: *fav
              - subPath: preview
                path: *preview
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - subPath: tmp
            path: /tmp
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostAliases:
        - ip: "${APP_IP_AUTHENTIK:=127.0.0.1}"
          hostnames: ["${APP_DNS_AUTHENTIK:=authentik}"]
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid 33 # www-data
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: Always
        seccompProfile: { type: "RuntimeDefault" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "fuckoff.home.arpa/{{ .Release.Name }}"
                    operator: DoesNotExist
