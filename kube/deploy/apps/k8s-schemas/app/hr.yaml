---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app k8s-schemas
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      extract:
        type: cronjob
        cronjob:
          schedule: "0 * * * *"
          concurrencyPolicy: "Replace"
        pod:
          automountServiceAccountToken: true
          labels:
            egress.home.arpa/apiserver: "allow"
            egress.home.arpa/r2: "allow"
            egress.home.arpa/github: "allow" # only because of the openapi2jsonschema.py script lol
            s3.home.arpa/store: "rgw-${CLUSTER_NAME}"
        initContainers:
          01-extract:
            image:
              repository: "jank.ing/jjgadgets/k8s-crd-extractor"
              tag: "20250627@sha256:a74d4c2059df2215c214664ddc3da9d5f2de4527e606c704f7136248945cc6a6"
            env:
              TZ: "${CONFIG_TZ}"
              HOME: ""
            securityContext: &sc
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "10m"
                memory: "128Mi"
              limits:
                cpu: "1000m"
                memory: "6000Mi"
        containers:
          rclone-r2: &rclone
            image: &rcimg
              repository: "jank.ing/jjgadgets/rclone"
              tag: "1.73.1@sha256:32e1ed90f7016c36ce871808edadc1c96ae422964b40a83f133a00cc353a2ed1"
            args: ["sync", "/.datree/crdSchemas/", "r2:k8s-schemas/", "--progress", "--fast-list", "--checksum"]
            env:
              TZ: "${CONFIG_TZ}"
            securityContext: *sc
            resources:
              requests:
                cpu: "10m"
                memory: "128Mi"
              limits:
                cpu: "1000m"
                memory: "6000Mi"
          rclone-rgw:
            <<: *rclone
            args: ["sync", "/.datree/crdSchemas/", "rgw:k8s-schemas-rgw", "--progress", "--fast-list", "--checksum"]
            envFrom:
              - secretRef:
                  name: "k8s-schemas-rgw"
            securityContext: *sc
      main:
        type: daemonset
        pod:
          automountServiceAccountToken: false
          labels:
            ingress.home.arpa/nginx-internal: "allow"
        containers:
          main:
            image: *rcimg
            args: ["serve", "http", "rgw:", "--read-only", "--no-modtime", "--vfs-cache-mode", "full", "--cache-dir", "/tmp/cache", "--addr", ":8080"]
            envFrom:
              - secretRef:
                  name: "k8s-schemas-rgw"
            securityContext: *sc
            resources:
              requests:
                cpu: "10m"
                memory: "128Mi"
              limits:
                cpu: "2000m"
                memory: "1024Mi"
    serviceAccount:
      k8s-schemas: {}
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
            protocol: HTTP
            appProtocol: http
    ingress:
      main:
        className: "nginx-internal"
        hosts:
          - host: &host "${APP_DNS_K8S_SCHEMAS:=schemas}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts: [*host]
    persistence:
      config:
        type: secret
        identifier: "k8s-schemas-rclone"
        globalMounts:
          - subPath: "rclone.conf"
            path: "/.rclone.conf"
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - subPath: "tmp"
            path: "/tmp"
            readOnly: false
          - subPath: "datree"
            path: "/.datree"
            readOnly: false
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid 1000
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: "Always"
        seccompProfile: { type: "RuntimeDefault" }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "fuckoff.home.arpa/k8s-schemas"
                    operator: "DoesNotExist"
