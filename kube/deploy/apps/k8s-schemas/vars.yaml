---
# yaml-language-server: $schema=https://crds.jank.ing/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name "${CLUSTER_NAME:=biohazard}-vars"
  namespace: k8s-schemas
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1p
  dataFrom:
    - extract:
        key: ".${CLUSTER_NAME}-vars"
    - extract:
        key: "k8s-schemas - ${CLUSTER_NAME}"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: *name
    template:
      type: Opaque
      data:
        # Core cluster-wide vars
        CLUSTER_NAME: "${CLUSTER_NAME:=biohazard}"
        CONFIG_TZ: '{{ .CONFIG_TZ }}'
        # App specific
        APP_DNS_K8S_SCHEMAS: '{{ .APP_DNS_K8S_SCHEMAS }}'
        APP_UID_K8S_SCHEMAS: '{{ .APP_UID_K8S_SCHEMAS }}'
        # R2 secrets
        SECRET_R2_ENDPOINT: '{{ .SECRET_R2_ENDPOINT }}'
        SECRET_K8S_SCHEMAS_R2_ID: '{{ .SECRET_K8S_SCHEMAS_R2_ID }}'
        SECRET_K8S_SCHEMAS_R2_KEY: '{{ .SECRET_K8S_SCHEMAS_R2_KEY }}'
