---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app go-discord-modtools
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      go-discord-modtools:
        type: deployment
        replicas: 1
        pod:
          labels:
            egress.home.arpa/discord: "allow"
        containers:
          main:
            image: &img
              repository: ghcr.io/tyzbit/go-discord-modtools
              tag: v0.3.1@sha256:a789bb7b4bd109f9a5f85f9d256a2ff27717c0a043132660a367b2fdc666987b
            env:
              TZ: "${CONFIG_TZ}"
            envFrom:
              - secretRef:
                  name: go-discord-modtools-secrets
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "50m"
              limits:
                memory: "512Mi"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      go-discord-modtools:
        controller: go-discord-modtools
        ports:
          http:
            port: 8080
            protocol: HTTP
            appProtocol: http
    persistence:
      data:
        existingClaim: go-discord-modtools-data
        advancedMounts:
          go-discord-modtools:
            main:
              - subPath: data
                path: /var/go-discord-modtools
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - subPath: tmp
            path: /tmp
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostAliases:
        - ip: "${APP_IP_AUTHENTIK:=127.0.0.1}"
          hostnames: ["${APP_DNS_AUTHENTIK:=authentik}"]
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: ${APP_UID_GO_DISCORD_MODTOOLS:=1000}
        runAsGroup: ${APP_UID_GO_DISCORD_MODTOOLS:=1000}
        fsGroup: ${APP_UID_GO_DISCORD_MODTOOLS:=1000}
        fsGroupChangePolicy: Always
        seccompProfile: { type: "RuntimeDefault" }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: fuckoff.home.arpa/go-discord-modtools
                    operator: DoesNotExist
