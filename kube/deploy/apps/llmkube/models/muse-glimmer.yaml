---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: muse-glimmer-radiance
  namespace: llmkube
spec:
  # Pin the Hugging Face revision and pre-stage the weights/projector on sinon.
  # The stock NVIDIA device plugin allocates a count, not individual GPU UUIDs.
  # This node has two NVIDIA GPUs and the service requests both; CUDA_DEVICE_ORDER
  # plus CUDA0/CUDA1 assign logical device indices after allocation. Selecting
  # specific UUIDs would require NVIDIA DRA or per-device plugin resources, which
  # this cluster does not currently configure.
  source: hf://DustinEwan/muse-glimmer-30b-nvfp4-dflash-fp4@b437d2bcc7594e1d7ed5b30cbee8c505d176437a
  files:
    - muse-glimmer-30b-nvfp4-dflash-fp4.rad
  # mmproj: mmproj-Muse-Glimmer-30B-Q8_0.gguf
  format: custom
  quantization: nvfp4-dflash-fp4
  prefetchNodeSelector:
    kubernetes.io/hostname: sinon
  prefetchTolerations:
    - key: llm.internal
      operator: Exists
      effect: NoSchedule
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      count: 1
      # DRA owns placement; the existing claim can be shared within llmkube.
      resourceClaims:
        - name: gpu
          resourceClaimName: r9700
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-radiance
  namespace: llmkube
spec:
  podLabels:
    prom.home.arpa/kps: allow
  modelRef: muse-glimmer-radiance
  runtime: generic
  # Standalone Radiance (not vLLM or vllm-radiance), pinned to linux/amd64.
  image: docker.io/stilldeadcode/radiance:1.17.0@sha256:6fb0e99bfb862e17cc15cb7b2f116c7dbdc831df59f82456a0691122e6cf5330
  nodeSelector:
    kubernetes.io/hostname: sinon
  tolerations:
    - key: llm.internal
      operator: Exists
      effect: NoSchedule
  endpoint:
    port: 8000
    type: ClusterIP
  modelCache:
    claimName: llmkube-models
    prefetch: true
  stageModel: true
  resources:
    gpu: 1
    cpu: "2"
    memory: 26Gi
    memoryLimit: 26Gi
  parallelSlots: 10
  startupTimeout: 45m
  # Roll only when vllm:num_requests_running is 0, else after 15 min.
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 900
  # Unlike vLLM, generic runtimes take spec.args verbatim, not extraArgs.
  args:
    - --live # log tokens per second
    - --model
    - "$(LLMKUBE_MODEL_PATH)"
    - --served-model-name
    - muse-glimmer-radiance
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --tp
    - "1"
    - --max-model-len
    - "131072"
    - --max-num-seqs
    - "10"
    - --kv-cache-dtype
    - fp8
    - --num-speculative-tokens
    - "0" # TODO: test this out, starting with 3
    # Leave only the recommended kernel/driver headroom; reserve the rest for
    # model weights and paged FP8 KV in Radiance's automatic placement planner.
    - --gpu-headroom-mib
    - "96"
    # Radiance uses MiB for the pinned CPU-side conversation KV cache.
    - --prefix-cache-mib
    - "12288"
    # CPU-resident multimodal tower, with GPU execution of vision kernels.
    - --vision-tower-placement
    - ram
    - --chat-template-kwargs
    - '{"preserve_thinking":true}'
    - --no-cors
    - --temp
    - "1.0"
    - --top-k
    - "64"
    - --top-p
    - "0.95"
    - --min-p
    - "0.0"
    - --presence-penalty
    - "0.0"
    - --repetition-penalty
    - "1.0"
    - --reasoning-effort
    - medium
  env:
    - name: TZ
      value: Asia/Singapore
    - name: HOME
      value: /tmp
    - name: XDG_CACHE_HOME
      value: /tmp
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: TMPDIR
      value: /tmp
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 270
    readiness:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 30
      timeoutSeconds: 5
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: ${APP_UID_LLMKUBE:=65536}
    runAsGroup: ${APP_UID_LLMKUBE:=65536}
    fsGroup: ${APP_UID_LLMKUBE:=65536}
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: ${APP_UID_LLMKUBE:=65536}
    runAsGroup: ${APP_UID_LLMKUBE:=65536}
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - IPC_LOCK
    seccompProfile:
      type: RuntimeDefault
