---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: muse-glimmer
  namespace: llmkube
spec:
  # Pin the Hugging Face revision and pre-stage the weights/projector on sinon.
  # The stock NVIDIA device plugin allocates a count, not individual GPU UUIDs.
  # This node has two NVIDIA GPUs and the service requests both; CUDA_DEVICE_ORDER
  # plus CUDA0/CUDA1 assign logical device indices after allocation. Selecting
  # specific UUIDs would require NVIDIA DRA or per-device plugin resources, which
  # this cluster does not currently configure.
  source: hf://unsloth/Muse-Glimmer-30B-GGUF@faa5b025c584459c13febfa5c59883516710ae39
  files:
    - Muse-Glimmer-30B-UD-Q3_K_XL.gguf
  # mmproj: mmproj-Muse-Glimmer-30B-Q8_0.gguf
  format: gguf
  quantization: UD-Q3_K_XL
  prefetchNodeSelector:
    kubernetes.io/hostname: sinon
  prefetchTolerations:
    - key: llm.internal
      operator: Exists
      effect: NoSchedule
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 2
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer
  namespace: llmkube
spec:
  podLabels:
    prom.home.arpa/kps: allow
  modelRef: muse-glimmer
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda12@sha256:c1d664830580e1651c1cc8d3bbc161af474800a56a83226e6e22f94bb8ba1c59
  nodeSelector:
    kubernetes.io/hostname: sinon
  tolerations:
    - key: llm.internal
      operator: Exists
      effect: NoSchedule
  endpoint:
    # The ModelRouter fronts this service; keep the runtime on its own port.
    port: 8000
    type: ClusterIP
  # Explicitly use the app-owned PVC from app/pvc.yaml. This claim overrides
  # the chart's operator-managed per-service cache fallback.
  modelCache:
    claimName: llmkube-models
    prefetch: true
  resources:
    gpu: 2
    cpu: "10m"
    memory: 20Gi
    memoryLimit: 30Gi
  contextSize: 131072
  parallelSlots: 3
  flashAttention: true
  batchSize: 4096
  uBatchSize: 2048
  extraArgs:
    - -sps
    - "0.5"
    - --load-mode
    - "mlock"
    - --fit
    - "off"
    - --split-mode
    - none
    - --main-gpu
    - "0"
  env:
    - name: TZ
      value: Asia/Singapore
    - name: LLAMA_OFFLINE
      value: enabled
    - name: LLAMA_ARG_ALIAS
      value: muse-glimmer
    - name: LLAMA_ARG_MODEL_ALIAS
      value: muse-glimmer
    - name: LLAMA_ARG_TEMPERATURE
      value: "1.0"
    - name: LLAMA_ARG_TOP_K
      value: "64"
    - name: LLAMA_ARG_TOP_P
      value: "0.95"
    - name: LLAMA_ARG_MIN_P
      value: "0.0"
    - name: LLAMA_ARG_PRESENCE_PENALTY
      value: "0.0"
    - name: LLAMA_ARG_REPEAT_PENALTY
      value: "1.0"
    - name: LLAMA_ARG_IMAGE_MIN_TOKENS
      value: "1024"
    - name: LLAMA_ARG_CACHE_RAM
      value: "7168"
    - name: LLAMA_ARG_CTX_CHECKPOINTS
      value: "12"
    - name: LLAMA_ARG_CHECKPOINT_MIN_SPACING_NT
      value: "16384"
    - name: LLAMA_ARG_REASONING_PRESERVE
      value: enabled
    - name: LLAMA_ARG_SLOT_SAVE_PATH
      value: /data/llama-cpp/
    - name: LLAMA_ARG_THREADS
      value: "7"
    - name: LLAMA_CHAT_TEMPLATE_KWARGS
      value: '{"enable_thinking":true,"preserve_thinking":true}'
    - name: LLAMA_ARG_DEVICE
      value: CUDA0
    - name: MTMD_BACKEND_DEVICE
      value: CUDA1
    - name: CUDA_DEVICE_ORDER
      value: PCI_BUS_ID
    - name: LLAMA_ARG_CONTEXT_SHIFT
      value: disabled
    - name: LLAMA_ARG_CACHE_PROMPT
      value: enabled
    - name: LLAMA_ARG_KV_UNIFIED
      value: enabled
    - name: LLAMA_ARG_CONT_BATCHING
      value: enabled
    - name: LLAMA_ARG_ENDPOINT_METRICS
      value: enabled
    - name: LLAMA_ARG_LOG_VERBOSITY
      value: "4"
    - name: CUDA_CACHE_PATH
      value: /tmp/.nv
  extraVolumes:
    - name: runtime-data
      persistentVolumeClaim:
        claimName: llmkube-runtime-data
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
  extraVolumeMounts:
    - name: runtime-data
      subPath: unsloth-muse-glimmer-30b-ud-q3_k_xl
      mountPath: /data/llama-cpp
    - name: tmp
      mountPath: /tmp
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: ${APP_UID_LLMKUBE:=65536}
    runAsGroup: ${APP_UID_LLMKUBE:=65536}
    fsGroup: ${APP_UID_LLMKUBE:=65536}
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: ${APP_UID_LLMKUBE:=65536}
    runAsGroup: ${APP_UID_LLMKUBE:=65536}
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - IPC_LOCK
    seccompProfile:
      type: RuntimeDefault
  startupTimeout: 45m
