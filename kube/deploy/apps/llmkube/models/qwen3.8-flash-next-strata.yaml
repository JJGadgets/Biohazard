---
# yaml-language-server: $schema=https://crds.jank.ing/inference.llmkube.dev/model_v1alpha1.json
# Qwen3.8-Flash-Next : the complete 92 GB GGUF includes the SSD-backed
# PLE/n-gram table. Strata prepares its smaller native pack separately in /data.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-flash-next-strata
  namespace: llmkube
spec:
  # Identical pin to Strata setup.py HF_REVISIONS; it verifies the model SHA256.
  # File SHA256: 7aa36d15131d255179ab6c87fa9c9f81a0b541fc9e81e959d4c3e29eb20feb5f
  source: hf://agentionai/Qwen3.8-Flash-Next-Gyro-GGUF@257c95704b87e99d12e4b1cbd65794837009d587
  files:
    - Qwen3.8-Flash-Next-Gyro-M-TQ2_0.gguf
    # - Qwen3.8-Flash-Next-Gyro-M-TQ2_0-noPLE.gguf
    # # - Qwen3.8-Flash-Next-Gyro-L-TQ3_0-noPLE.gguf
    # - https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF/resolve/f5d175de2cf7f720d45d6064019a81fcf056e986/engram/Qwen3.8-Flash-Next-engram-Q8_0.gguf_file
    - mtp-Qwen3.8-Flash-Next-draft.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: Gyro-M-TQ2_0
  prefetchNodeSelector:
    kubernetes.io/hostname: sinon
  prefetchTolerations:
    - key: llm.internal
      operator: Exists
      effect: NoSchedule
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      count: 1
      resourceClaims:
        - name: gpu
          resourceClaimName: r9700
---
# yaml-language-server: $schema=https://crds.jank.ing/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-flash-next-strata
  namespace: llmkube
  annotations:
    # Strata's /metrics defaults to JSON without an explicit format.
    inference.llmkube.dev/idle-metric: "vllm:num_requests_running"
    inference.llmkube.dev/idle-metric-path: "/metrics?format=prometheus"
    inference.llmkube.dev/idle-metric-threshold: "0"
spec:
  podLabels:
    prom.home.arpa/kps: allow
  modelRef: qwen3.8-flash-next-strata
  runtime: generic
  # Upstream Strata's gfx120x HIP build; pin both release and image digest.
  image: ghcr.io/niko1221/strata:0.2.13-rocm-gfx120x@sha256:c68ebd4ecbf73f7f450bea4a60bbc014be83d78c9fbfbdc16df6f553cb442235
  nodeSelector:
    kubernetes.io/hostname: sinon
  tolerations:
    - key: llm.internal
      operator: Exists
      effect: NoSchedule
  endpoint:
    port: 8080
    type: ClusterIP
  modelCache:
    claimName: llmkube-models
    prefetch: true
  # Read-only staged model; pack, MTP and tuning state stay on the /data PVC.
  stageModel: true
  resources:
    gpu: 1
    cpu: "10m"
    memory: 20Gi
    memoryLimit: 99Gi
    # Deliberately high memoryLimit: Strata sizes host expert residency against
    # MemAvailable, and upstream warns a cgroup limit can cause false-fit OOMs.
  parallelSlots: 1
  startupTimeout: 180m
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 7200
  env:
    - name: TZ
      value: Asia/Singapore
    - name: FAMILY
      value: gyro
    - name: MODEL
      value: Gyro-M
    - name: MODEL_PATH
      value: "$(LLMKUBE_MODEL_DIR)"
    - name: CONTEXT
      value: "200000"
    - name: PARALLEL
      value: "4"
    - name: VISION
      value: "cpu" # or "cpu" # Preserve VRAM for 180K context/expert cache.
    - name: KV
      value: int8 # 8-bit integer KV. Strata does not currently implement FP8 KV.
    - name: GPU
      value: "0" # DRA makes the single R9700 the only visible HIP device.
    - name: STRATA_ENGINE_BACKEND
      value: hip
    - name: NVIDIA_VISIBLE_DEVICES
      value: void
    - name: TUNE
      value: quick # One-time, retained on /data across model swaps.
    - name: STRATA_PLE_AUTO_RAM
      value: "1" # stream the 28.8 GB PLE table from local SSD.
    - name: STRATA_RESIDENT_HEADROOM_GIB
      value: "8" # Avoid consuming the host's remaining 32 GB RAM.
    # - name: PRESET
    #   value: qwen3-8-flash-next-r9700
    # ModelRouter has no configured backend credential injection: restrict the
    # unauthenticated backend using namespace Cilium policy + Host allowlist.
    - name: API_KEY
      value: none
    - name: STRATA_ALLOWED_HOSTS
      value: "llmkube,${APP_DNS_LLMKUBE:=llmkube},qwen3-8-flash-next-strata,qwen3-8-flash-next-strata.llmkube.svc,qwen3-8-flash-next-strata.llmkube.svc.cluster.local,qwen3.8-flash-next-strata,qwen3.8-flash-next-strata.llmkube.svc.cluster.local"
    - name: STRATA_SET
      value: "reasoning-effort=medium ple-gguf=$(LLMKUBE_MODEL_DIR)/engram/Qwen3.8-Flash-Next-PLE-Q8_0.gguf"
  args:
    - run
    - --draft-model
    - "$(LLMKUBE_MODEL_DIR)/mtp-Qwen3.8-Flash-Next-draft.gguf"
  extraVolumes:
    - name: strata-data
      persistentVolumeClaim:
        claimName: llmkube-strata-data
    - name: tmp
      emptyDir:
        sizeLimit: 2Gi
    - name: run
      emptyDir:
        sizeLimit: 16Mi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
  extraVolumeMounts:
    - name: strata-data
      mountPath: /data
    - name: tmp
      mountPath: /tmp
    - name: run
      mountPath: /run
    - name: shm
      mountPath: /dev/shm
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 1080
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      timeoutSeconds: 5
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: ${APP_UID_LLMKUBE:=65536}
    runAsGroup: ${APP_UID_LLMKUBE:=65536}
    fsGroup: ${APP_UID_LLMKUBE:=65536}
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: ${APP_UID_LLMKUBE:=65536}
    runAsGroup: ${APP_UID_LLMKUBE:=65536}
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - IPC_LOCK
    seccompProfile:
      type: RuntimeDefault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8-flash-next-mtp-prepare
  namespace: llmkube
  labels:
    app.kubernetes.io/name: strata-mtp-prepare
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 28800

  template:
    metadata:
      labels:
        app.kubernetes.io/name: strata-mtp-prepare
        # Reuse the existing llmkube-model-prefetch Cilium policy.
        app.kubernetes.io/component: model-prefetch

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # runtimeClassName: gvisor

      nodeSelector:
        kubernetes.io/hostname: sinon

      tolerations:
        - key: llm.internal
          operator: Exists
          effect: NoSchedule

      securityContext:
        runAsNonRoot: true
        runAsUser: ${APP_UID_LLMKUBE:=65536}
        runAsGroup: ${APP_UID_LLMKUBE:=65536}
        fsGroup: ${APP_UID_LLMKUBE:=65536}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: prepare
          # Matches the existing Strata InferenceService.
          image: ghcr.io/niko1221/strata:0.2.13-rocm-gfx120x@sha256:c68ebd4ecbf73f7f450bea4a60bbc014be83d78c9fbfbdc16df6f553cb442235
          imagePullPolicy: IfNotPresent

          # Bypass the serving entrypoint.
          # Run the image's bundled, version-matched preparation tools.
          command: [/bin/sh, -ec]
          args:
            - |
              set -eu

              ROOT=/opt/strata/terminal
              PY="$ROOT/python/bin/python3"
              MTP=/data/Strata-data/mtp
              RT="$MTP/rt"

              # Published SHA-256s from upstream Strata benchmarks.
              verify_runtime() {
                printf '%s\n' \
                  '09398406be61f1f54c93861f449e48b8df0bfccbc9ec9b2b7636775a6ea9244f  experts.bin' \
                  'c724dc0b0822ada5d2977bf5beabaa64ea2e0045b67ca656329070a  dense.bin' \
                  '991456cf4eb266eb8a888c349e548d11bc640f5dbd9149439aa9786af0f732fd  dense.txt' \
                  'b1e1d3a7a9e4bf862dcd5923ce661fb59bbd07907e594df5cf86a62ac235cb91  draft_vocab.bin' \
                  | sha256sum -c -
              }

              mkdir -p "$MTP"

              # Idempotent: accept only a complete, verified runtime.
              if [ -e "$RT" ]; then
                if [ -d "$RT" ] && (cd "$RT" && verify_runtime); then
                  echo 'Verified MTP runtime already present.'
                  exit 0
                fi
                echo 'Existing MTP runtime failed verification; refusing to overwrite.' >&2
                exit 1
              fi

              # Download approximately 5.2 GB of the original Qwen
              # checkpoint's MTP tensors (not the full BF16 model).
              "$PY" "$ROOT/tools/mtp_fetch.py" fetch \
                --out "$MTP"

              # Verify all 31 tensors against Strata's pinned SHA-256s.
              "$PY" "$ROOT/tools/mtp_fetch.py" verify \
                --out "$MTP"

              # Quantize the MTP experts to Q2_0.
              "$PY" "$ROOT/tools/mtp_pack.py" \
                --src "$MTP" \
                --experts q2_0 \
                --out "$MTP/mtp-q2_0.gguf"

              # Prepare separately to prevent publishing partial files.
              stage="$(mktemp -d "$MTP/.rt-preparing.XXXXXXXX")"
              trap 'rm -rf "$stage"' EXIT

              "$PY" "$ROOT/tools/mtp_rt.py" \
                --gguf "$MTP/mtp-q2_0.gguf" \
                --out "$stage"

              cp "$ROOT/data/draft_vocab.bin" \
                "$stage/draft_vocab.bin"

              # Refuse to publish unexpected conversion outputs.
              (cd "$stage" && verify_runtime)

              # Atomic publication on the same filesystem.
              mv -T -- "$stage" "$RT"
              trap - EXIT

              echo 'MTP runtime ready: /data/Strata-data/mtp/rt'

          env:
            - name: STRATA_MTP_REVISION
              value: de4b8e4d43b917e7706784d8bb445c9af86a3540
            - name: STRATA_ALLOW_UNPINNED
              value: "0"
            - name: STRATA_GGUF_PY
              value: /opt/strata/seed/third_party/llama.cpp/gguf-py
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONNOUSERSITE
              value: "1"
            - name: TMPDIR
              value: /tmp

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi

          volumeMounts:
            - name: strata-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: strata-data
          persistentVolumeClaim:
            claimName: llmkube-strata-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
