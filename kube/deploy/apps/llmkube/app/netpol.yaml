---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-controller-manager
  namespace: llmkube
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: llmkube
      app.kubernetes.io/name: llmkube
      app.kubernetes.io/instance: llmkube
      control-plane: controller-manager
  ingress:
    # Health probes stay namespace-local.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llmkube
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # The controller metrics endpoint uses HTTP on a ClusterIP Service;
    # only the in-cluster Prometheus scraper may read it.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            prometheus: "kps"
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llmkube
            inference.llmkube.dev/model-router: llmkube-router
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-router-proxy
  namespace: llmkube
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: llmkube
      inference.llmkube.dev/model-router: llmkube-router
  ingress:
    # Model API ingress is cluster-internal; the router Service is not exposed.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The operator reads swap-budget status from the proxy's admin listener.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llmkube
            app.kubernetes.io/name: llmkube
            app.kubernetes.io/instance: llmkube
            control-plane: controller-manager
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Prometheus scrapes LLMKube router/model-pool metrics on this listener.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            prometheus: "kps"
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llmkube
            inference.llmkube.dev/service: qwen3.6-35b-a3b
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# LLMKube v0.10.6+ stages models in operator-managed prefetch Jobs labeled
# app.kubernetes.io/component=model-prefetch.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-model-prefetch
  namespace: llmkube
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: model-prefetch
  egress:
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "*.huggingface.co"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # DNS queries are filtered to the same Hugging Face host allowlist.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: huggingface.co
              - matchPattern: "*.huggingface.co"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qwen3-model
  namespace: llmkube
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: llmkube
      inference.llmkube.dev/service: qwen3.6-35b-a3b
  ingress:
    # Client traffic reaches the inference runtime through the model router.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llmkube
            inference.llmkube.dev/model-router: llmkube-router
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Permit the Prometheus pods to fetch only the Prometheus exposition path;
    # they cannot use this exception to send inference requests to the runtime.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            prometheus: "kps"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "^/metrics$"
  egress: []
