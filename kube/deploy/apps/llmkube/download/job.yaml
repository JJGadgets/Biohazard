---
apiVersion: batch/v1
kind: Job
metadata:
  name: llmkube-chat-template-download
  namespace: llmkube
  labels:
    app.kubernetes.io/name: llmkube
    app.kubernetes.io/component: model-prefetch
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmkube
        app.kubernetes.io/component: model-prefetch
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      nodeSelector:
        kubernetes.io/hostname: sinon
        feature.node.kubernetes.io/baremetal: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${APP_UID_LLMKUBE:=65536}
        runAsGroup: ${APP_UID_LLMKUBE:=65536}
        fsGroup: ${APP_UID_LLMKUBE:=65536}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download-chat-template
          image: registry.jjgadgets.tech/jjgadgets/hf:1.15.0@sha256:b94cb083b60c422cf7f90bb3423a6ab85744f53e649517396ed812fddcfb2bf4
          imagePullPolicy: IfNotPresent
          args:
            - download
            - --exclude
            - .git
            - --local-dir
            - /models
            - --revision
            - cc662897c571bc90d74ff9e4c53d682b40eabe20
            - froggeric/Qwen-Fixed-Chat-Templates
            - chat_template.jinja
          env:
            - name: HOME
              value: /models
            - name: HF_HOME
              value: /models
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: TMPDIR
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: ${APP_UID_LLMKUBE:=65536}
            runAsGroup: ${APP_UID_LLMKUBE:=65536}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: templates
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: templates
          persistentVolumeClaim:
            claimName: llmkube-templates
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
