---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app esphome
  namespace: *app
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: *app
  values:
    controllers:
      app:
        type: deployment
        replicas: 1
        pod:
          labels:
            ingress.home.arpa/nginx-internal: allow
            egress.home.arpa/iot: allow
            egress.home.arpa/esp: allow
            egress.home.arpa/internet: allow
        containers:
          app:
            image: &img
              repository: ghcr.io/home-operations/esphome
              tag: 2026.7.3@sha256:243405d1349d6ad7b656753235a5ca96df603886f3bd970f6012d4d6ae9ce27d
            env:
              TZ: "${CONFIG_TZ}"
              ESPHOME_DASHBOARD_USE_PING: "true"
            envFrom:
              - secretRef:
                  name: esphome-secrets
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "5m"
                memory: "512Mi"
              limits:
                cpu: "6"
                memory: "4Gi"
    service:
      app:
        controller: app
        ports:
          http:
            port: 80
            targetPort: 6052
            protocol: HTTP
            appProtocol: http
    route:
      app:
        annotations:
          nginx.ingress.kubernetes.io/whitelist-source-range: "${IP_JJ_V4:=127.0.0.1/32}"
        hostnames: ["${APP_DNS_ESPHOME:=esphome}"]
        parentRefs:
          - name: nginx-internal
            namespace: ingress
            sectionName: internal
    persistence:
      data:
        existingClaim: esphome-data
        advancedMounts:
          app:
            app:
              - subPath: data
                path: /config
      config:
        type: configMap
        name: esphome-config
        advancedMounts:
          app:
            app:
              - subPath: .common.yaml
                path: /config/.common.yaml
              - subPath: .wifi.yaml
                path: /config/.wifi.yaml
              - subPath: .mqtt.yaml
                path: /config/.mqtt.yaml
              - subPath: .metadata.yaml
                path: /config/.metadata.yaml
              - subPath: .bluetooth-proxy.yaml
                path: /config/.bluetooth-proxy.yaml
              - subPath: .mitsubishi-cn105.yaml
                path: /config/.mitsubishi-cn105.yaml
              - subPath: jj-room-ac.yaml
                path: /config/jj-room-ac.yaml
              - subPath: master-bedroom-ac.yaml
                path: /config/master-bedroom-ac.yaml
              - subPath: jj-room-presence.yaml
                path: /config/jj-room-presence.yaml
              - subPath: master-bedroom-presence.yaml
                path: /config/master-bedroom-presence.yaml
      secrets:
        type: secret
        name: esphome-secrets
        advancedMounts:
          app:
            app:
              - subPath: secrets.yaml
                path: /config/secrets.yaml
      cache:
        type: emptyDir
      tmp:
        type: emptyDir
      multus:
        type: multus
        networkDevices:
          - name: iot
            networkName: esphome/iot
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostAliases:
        - ip: "${APP_IP_AUTHENTIK:=127.0.0.1}"
          hostnames: ["${APP_DNS_AUTHENTIK:=authentik}"]
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: &uid 1000
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: Always
        seccompProfile: { type: "RuntimeDefault" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "fuckoff.home.arpa/{{ .Release.Name }}"
                    operator: DoesNotExist
                  - key: "feature.node.kubernetes.io/cpu-model.family"
                    operator: In
                    values: ["6"]
                  - key: "feature.node.kubernetes.io/cpu-model.id"
                    operator: In
                    values: ["154"]
    networkpolicies:
      esp:
        controller: app
        policyTypes: [Ingress, Egress]
        rules:
          egress:
            - to:
                - ipBlock:
                    cidr: "${IP_VLAN_ESP_CIDR:=127.0.0.1/32}"
