---
substitutions:
  area: "$${area}"
  name: "$${name}"
  area_id: "$${area_id}"
  area_dns: "$${area_dns}"
  name_dns: "$${name_dns}"
  climate_id: "aircon_$${area_id}"
  description: "Mitsubishi CN105 compatible ESP32 serial air conditioner controller for $${area}"
packages:
  common: !include
    file: ./.common.yaml
    vars:
      board: "$${board | default('lolin_s3_mini')}"
      # version: "5.4.1"
  wifi: !include
    file: ./.wifi.yaml
    vars:
      wifi_ip: "$${wifi_ip}"
#   mqtt: !include
#     file: ./.mqtt.yaml
#     vars:
#       mqtt_username: !secret mqtt_cn105_username
#       mqtt_password: !secret mqtt_cn105_password
#       mqtt_prefix: "cn105/$${area_dns}"

# Mitsubishi CN105 air conditioner controller
external_components:
  - source:
      type: git
      url: https://github.com/echavet/MitsubishiCN105ESPHome
      ref: 2026.5.1
climate: # Climate entity config
  - platform: cn105
    id: "$${climate_id}"
    name: "Air Conditioner - $${area}"
    icon: mdi:air-conditioner
    update_interval: 2s # update interval can be adjusted after a first run and logs monitoring
    visual:
      min_temperature: 16
      max_temperature: 28
      temperature_step:
        target_temperature: 1
        current_temperature: 0.1
    remote_temperature_source:
      sensor_id: remote_temp_sensor # References the sensor declared above
      info: # Optional: exposes a text sensor showing the source name
        name: "Remote Temp Source"
    remote_temperature_timeout: 5min
    remote_temperature_keepalive_interval: 120s
    compressor_frequency_sensor:
      name: Compressor Frequency
      entity_category: diagnostic
      disabled_by_default: false
    vertical_vane_select:
      name: Vertical Vane
      disabled_by_default: false
    # horizontal_vane_select:
    #   name: Horizontal Vane
    #   disabled_by_default: true
    # isee_sensor:
    #   name: ISEE Sensor
    #   disabled_by_default: true
    # stage_sensor:
    #   name: Stage
    #   # use_as_operating_fallback: false     # set to true if your unit doesn't provide activity indicator
    #   entity_category: diagnostic
    #   disabled_by_default: true
    # sub_mode_sensor:
    #   name: Sub Mode
    #   entity_category: diagnostic
    #   disabled_by_default: true
    # auto_sub_mode_sensor:
    #   name: Auto Sub Mode
    #   entity_category: diagnostic
    #   disabled_by_default: true
uart:
  id: HP_UART
  baud_rate: 2400
  # TX and RX have to be inverted from pinout
  tx_pin: "$${tx_pin | default('GPIO44')}"
  rx_pin: "$${rx_pin | default('GPIO43')}"
# feed current temperature from HASS sensor
sensor:
  - platform: homeassistant
    name: "Remote Temperature Sensor"
    id: remote_temp_sensor
    entity_id: "$${hass_temp_sensor}" # Replace with your HomeAssistant remote sensor entity id, or include in substitutions
    # internal: false # idk why example uses this
    # disabled_by_default: true
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    filters:
      - clamp: # Limits values to range accepted by Mitsubishi units
          min_value: 0
          max_value: 40
          ignore_out_of_range: true
      - throttle: 30s
    on_raw_value:
      then:
        - logger.log:
            level: INFO
            format: "Remote temperature received from HA: %.1f C"
            args: ["x"]
        - if:
            condition:
              lambda: "return !id(remote_temp_switch).state;"
            then:
              - lambda: "id(remote_temp_sensor).publish_state(0);" # TODO: set on switch on of remote temp switch, set even if changes are in decimal places (more frequent), handle non-numbers (e.g. "unknown") as unable to update temp, after 5 minutes of no updates, revert back to internal sensor
switch:
  - platform: template
    name: "Enable Remote Temperature (default $${remote_temp_enable})"
    id: remote_temp_switch
    restore_mode: "RESTORE_DEFAULT_$${remote_temp_enable}"
    optimistic: true
    turn_on_action:
      - logger.log:
          level: INFO
          format: "Remote temperature enabled"
      - lambda: "id($${climate_id}).set_remote_temperature(id(remote_temp_sensor).get_state());"
    turn_off_action:
      - delay: 2s
      - logger.log:
          level: INFO
          format: "Remote temperature disabled, setting to 0 to revert to internal temperature"
      - lambda: "id($${climate_id}).set_remote_temperature(0);"
  # - platform: template
  #   name: "Remote Temperature State Before HASS Down"
  #   id: remote_temp_switch_old
  #   restore_mode: "RESTORE_DEFAULT_$${remote_temp_enable}"
  #   optimistic: true
  #   internal: true
api:
  on_client_connected:
    - delay: 3s
    - logger.log:
        format: "Client %s connected to API with IP %s"
        args: ["client_info.c_str()", "client_address.c_str()"]
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - logger.log: "HASS connected, setting remote temp to previous/default value..."
          - switch.turn_on: remote_temp_switch
          # - switch.control:
          #     id: remote_temp_switch
          #     state: !lambda |-
          #       return id(remote_temp_switch_old).state;
        else:
          - logger.log: "Client connected did not subscribe to state changes."
  on_client_disconnected:
    - logger.log:
        format: "Client %s disconnected from API with IP %s"
        args: ["client_info.c_str()", "client_address.c_str()"]
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - logger.log: "HASS disconnected, disabled remote temp."
          - switch.turn_off: remote_temp_switch
          # - switch.control:
          #     id: remote_temp_switch_old
          #     state: !lambda |-
          #       return id(remote_temp_switch).state;
        else:
          - logger.log: "Client disconnected did not subscribe to state changes."
logger:
  logs:
    CYCLE: WARN
