---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: media
  namespace: media
  annotations:
    description: VLAN tagging based on MAC handled by FortiSwitch NAC
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "media",
      "plugins": [
        {
          "type": "bridge",
          "bridge": "br0",
          "capabilities": { "ips": true, "mac": true },
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "0.0.0.0/0", "gw": "${IP_ROUTER_VLAN_MEDIA:=127.0.0.1}" },
              { "dst": "${IP_VLAN_MEDIA_CIDR:=127.0.0.1/32}", "gw": "${IP_ROUTER_VLAN_MEDIA:=127.0.0.1}" },
              { "dst": "224.0.0.0/4", "gw": "${IP_ROUTER_VLAN_MEDIA:=127.0.0.1}" }
            ]
          }
        },
        { "type": "sbr" }
      ]
    }
